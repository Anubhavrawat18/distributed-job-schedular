services:
  postgres:
    image: postgres:16-alpine
    container_name: job-scheduler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: job_scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d job_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Scale with: docker compose up -d --scale worker=5
  # No container_name here — Compose needs to generate one per replica.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the Compose network Postgres is reachable by service name.
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/job_scheduler
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      CLAIM_STRATEGY: ${CLAIM_STRATEGY:-skip_locked}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BASE_MS: ${RETRY_BASE_MS:-1000}
      RETRY_MAX_MS: ${RETRY_MAX_MS:-30000}

  # Safe to scale: definitions are claimed with FOR UPDATE SKIP LOCKED and a
  # unique index on (recurring_job_id, scheduled_for) backstops it.
  scheduler:
    build: .
    command: ["npx", "ts-node", "src/scheduler/scheduler.ts"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/job_scheduler
      SCHEDULER_POLL_INTERVAL_MS: ${SCHEDULER_POLL_INTERVAL_MS:-1000}

volumes:
  pgdata:
